<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400" role="img" aria-labelledby="title">
  <title id="title">Yoga Verde — Cosmética natural</title>
  <defs>
    <filter id="brand-black" color-interpolation-filters="sRGB">
      <feFlood flood-color="#183425" result="brand-color" />
      <feComposite in="brand-color" in2="SourceAlpha" operator="in" result="silhouette" />
    </filter>
  </defs>
  <image href="/yoga-verde/assets/brand/logo-yoga-verde.svg" width="1400" height="1400" preserveAspectRatio="none" filter="url(#brand-black)" />
</svg>
