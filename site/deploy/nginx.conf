server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy strict-origin-when-cross-origin;
  add_header X-Frame-Options SAMEORIGIN;

  # Canonicaliza la portada antes de que la reescritura específica del host
  # pueda convertir /yoga-verde en /yoga-verde/yoga-verde.
  location = /yoga-verde {
    return 308 /yoga-verde/;
  }

  location / {
    if ($host = yoga-verde.srv1175749.hstgr.cloud) {
      rewrite ^/$ /yoga-verde/ break;
      rewrite ^/(?!yoga-verde/)(.*)$ /yoga-verde/$1 break;
    }
    try_files $uri $uri/ =404;
  }

  location = /404.html {
    internal;
  }

  # shop.js no lleva hash de Astro; no lo congeles durante 30 días porque una
  # edición del modal debe llegar al siguiente refresh del visitante.
  location = /yoga-verde/shop.js {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
  }

  # Los assets compilados de Astro y las fuentes deben resolverse en la raíz
  # antes de la reescritura del host Yoga Verde.
  location ~* \.(css|js|mjs|jpg|jpeg|png|svg|webp|avif|ico|ttf|otf|woff|woff2)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }
}
